name: Refresh observation links
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: observation-index
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'numpy>=2,<3' 'requests>=2.32,<3' 'shapely>=2.1,<3' 'pyproj>=3.7,<4'
      - name: Refresh cached comment links
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python indexer.py --refresh-links
